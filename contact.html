<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#a9c5a6"><title>Contact — Whats'Eat?</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#24352b;background:#f5f8f4}*{box-sizing:border-box}body{margin:0}main{max-width:640px;margin:auto;padding:22px 18px 60px}header{background:#a9c5a6;padding:calc(16px + env(safe-area-inset-top, 0px)) 20px 16px}main{padding-bottom:calc(60px + env(safe-area-inset-bottom, 0px))}header a{color:#163b24;text-decoration:none;font-weight:700}h1{font-size:1.6rem}h2{font-size:1.12rem;margin-top:28px}.card{background:white;border-radius:18px;padding:22px;box-shadow:0 2px 12px #163b2410}label{display:block;font-weight:600;margin:15px 0 6px}input,select,textarea{width:100%;border:1px solid #b9c7bb;border-radius:10px;padding:12px;font:inherit;background:#fff;color:#24352b;min-height:44px}textarea{resize:vertical}.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;font-weight:400}.check input{width:auto;min-height:0;margin-top:4px}button{width:100%;padding:14px;border:0;border-radius:12px;background:#285c3c;color:white;font-weight:700;font-size:1rem;margin-top:18px}button:disabled{opacity:.6}p,li{line-height:1.55}small,.muted{color:#5c6d60}a{color:#236c40}#status{margin-top:12px;min-height:1.5em}#status[role=alert]{color:#a02c2c}</style></head><body><header><a href="./" id="supportBack">← Retour</a></header><main><div class="card"><h1>Contacter Whats'Eat?</h1><p>Une question, une suggestion ou un bug ? Écris-nous depuis ce formulaire.</p><form id="contactForm" action="https://formspree.io/f/xljjvedb" method="POST"><label for="email">Votre adresse e-mail</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required><label for="motif">Motif</label><select id="motif" name="motif" required><option value="">Choisir un motif</option><option>Signaler un bug</option><option>Proposer une amélioration</option><option>Poser une question</option><option>Autre demande</option></select><label for="message">Votre message</label><textarea id="message" name="message" rows="6" maxlength="5000" minlength="10" required></textarea><input type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-10000px;height:1px;width:1px"><label class="check"><input id="consent" type="checkbox" required>J’accepte que mes informations soient transmises à Formspree pour traiter ma demande, conformément à la <a href="confidentialite.html">politique de confidentialité</a>.</label><button id="submit" type="submit">Envoyer mon message</button><p id="status" role="status" aria-live="polite"></p></form><small>Vous pouvez également écrire à <a href="mailto:contact@whatseat.fr">contact@whatseat.fr</a>.</small></div></main><script>const form=document.getElementById('contactForm'),btn=document.getElementById('submit'),status=document.getElementById('status');form.addEventListener('submit',async e=>{e.preventDefault();if(!form.reportValidity())return;btn.disabled=true;status.textContent='Envoi en cours…';status.setAttribute('role','status');try{const response=await fetch(form.action,{method:'POST',body:new FormData(form),headers:{Accept:'application/json'}});if(!response.ok){let message='Le message n’a pas pu être envoyé. Réessaie plus tard.';try{const data=await response.json();if(data.errors?.length)message=data.errors.map(x=>x.message).join(' ')}catch{}throw new Error(message)}form.reset();status.textContent='Votre message a bien été envoyé. Merci !'}catch(err){status.setAttribute('role','alert');status.textContent=err.message||'Erreur réseau : vérifie ta connexion puis réessaie.'}finally{btn.disabled=false}});</script><script>(function(){const back=document.getElementById('supportBack');back.addEventListener('click',function(e){if(window.parent!==window){e.preventDefault();window.parent.postMessage('whatseat:support-close',location.origin);}else if(document.referrer&&new URL(document.referrer).origin===location.origin&&history.length>1){e.preventDefault();history.back();}});})();</script></body></html>
