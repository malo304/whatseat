name: Synchroniser les recettes publiques
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/sync_hellofresh.py
      - name: Commit catalogue si modifié
        run: |
          git config user.name 'WhatsEat sync'
          git config user.email 'actions@users.noreply.github.com'
          git add recipes.json
          git diff --cached --quiet || (git commit -m 'Mise à jour catalogue public' && git push)
