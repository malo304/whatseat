name: Synchroniser les recettes publiques

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: write

# Évite que deux exécutions de ce workflow modifient le catalogue en même temps.
concurrency:
  group: whatseat-catalogue-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/sync_hellofresh.py
      - name: Enrichir les valeurs nutritionnelles HelloFresh
        run: python scripts/enrich_nutrition.py
      - name: Commit catalogue si modifié
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WhatsEat sync'
          git config user.email 'actions@users.noreply.github.com'
          git add recipes.json
          if git diff --cached --quiet; then
            echo 'Catalogue inchangé : aucun commit nécessaire.'
            exit 0
          fi
          git commit -m 'Mise à jour catalogue public'

          # Une modification du dépôt peut intervenir pendant la synchronisation.
          # On récupère ces commits sans jamais forcer le push.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Conflit lors de la mise à jour de main : arrêt sans écraser le catalogue distant.' >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              echo 'Catalogue publié.'
              exit 0
            fi
            echo "Push refusé (tentative ${attempt}/3), nouvelle synchronisation avec main..."
            sleep 3
          done
          echo 'Publication impossible après trois tentatives, sans écrasement des données.' >&2
          exit 1
